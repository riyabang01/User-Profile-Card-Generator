<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Studio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a 60%, #020617);
            color: #f8fafc;
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .header h1 {
            font-size: 2rem;
            margin: 0 0 8px;
            background: linear-gradient(90deg, #a5b4fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #94a3b8;
            margin: 0;
            font-size: 0.95rem;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            max-width: 880px;
            width: 100%;
            justify-content: center;
            align-items: center;
        }
        .form-box {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            flex: 1;
            min-width: 310px;
            max-width: 420px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="url"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 10px;
            color: #f8fafc;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.35);
        }
        .profile-card {
            background: linear-gradient(160deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            width: 330px;
            overflow: hidden;
            text-align: center;
            animation: popIn 0.35s ease-out;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .card-banner {
            height: 110px;
            background: linear-gradient(120deg, #6366f1, #a855f7, #ec4899);
        }
        .avatar-wrapper {
            width: 108px;
            height: 108px;
            margin: -54px auto 0;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0f172a;
            background-color: #1e293b;
        }
        .card-body {
            padding: 16px 24px 28px;
        }
        .card-body h3 {
            margin: 6px 0 4px;
            font-size: 1.4rem;
            color: #ffffff;
        }
        .card-role {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a5b4fc;
            margin-bottom: 14px;
        }
        .card-bio {
            font-size: 0.92rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin: 0 0 18px;
        }
        .card-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Profile Card Studio</h1>
        <p>Fill in your details to generate a sleek developer card</p>
    </div>

    <div class="container">
        <div class="form-box">
            <form id="profileForm">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="name" placeholder="e.g., Aarav Sharma" required>
                </div>

                <div class="form-group">
                    <label>Role / Title</label>
                    <input type="text" name="role" placeholder="e.g., Full-Stack Developer">
                </div>

                <div class="form-group">
                    <label>Bio</label>
                    <textarea name="bio" rows="3" placeholder="Tell people what you do..."></textarea>
                </div>

                <div class="form-group">
                    <label>Profile Image URL (Optional)</label>
                    <input type="url" name="image_url" placeholder="https://example.com">
                </div>

                <button type="submit">✨ Generate Profile Card</button>
            </form>
        </div>

        <div id="cardResult"></div>
    </div>

    <script>
        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            const response = await fetch('/generate-card', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const cardHtml = await response.text();
                document.getElementById('cardResult').innerHTML = cardHtml;
            }
        });
    </script>

</body>
</html>
